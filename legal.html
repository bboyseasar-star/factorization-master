<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>このアプリについて</title><link rel="stylesheet" href="style.css"></head><body><main class="play"><a class="legal-link" href="./">← ホーム画面に戻る</a><div role="tablist" aria-label="権利情報"><button class="secondary" role="tab" aria-selected="true" aria-controls="notice" id="notice-tab">利用条件・出典・プライバシー</button><button class="secondary" role="tab" aria-selected="false" aria-controls="license" id="license-tab">ライセンス</button></div><section class="result-card" id="notice" role="tabpanel" aria-labelledby="notice-tab"></section><section class="result-card" id="license" role="tabpanel" aria-labelledby="license-tab" hidden></section><a class="legal-link" href="./">← ホーム画面に戻る</a></main><script>
function fillNotice(text){const n=document.getElementById('notice');for(const line of text.split(/\n+/).map(s=>s.trim()).filter(Boolean)){const e=document.createElement(line.startsWith('# ')?'h1':line.startsWith('## ')?'h2':'p');e.textContent=line.replace(/^#{1,2} /,'');n.append(e)}}
function fillLicense(text){const p=document.createElement('pre');p.textContent=text;document.getElementById('license').append(p)}
Promise.all([fetch('NOTICE.md').then(r=>r.ok?r.text():Promise.reject()),fetch('LICENSE').then(r=>r.ok?r.text():Promise.reject())]).then(([notice,license])=>{fillNotice(notice);fillLicense(license)}).catch(()=>{const p=document.createElement('p');p.textContent='権利情報を読み込めませんでした。再読み込みしてください。';document.getElementById('notice').append(p)});
document.querySelectorAll('[role=tab]').forEach(t=>t.onclick=()=>{for(const x of document.querySelectorAll('[role=tab]'))x.setAttribute('aria-selected',x===t);document.getElementById('notice').hidden=t.id!=='notice-tab';document.getElementById('license').hidden=t.id!=='license-tab'});
</script></body></html>
